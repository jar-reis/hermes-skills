name: Update GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'registry.json'
      - 'scripts/generate_registry.py'
      - '**/SKILL.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate registry.json
        run: |
          python3 scripts/generate_registry.py --output registry.json

      - name: Copy registry.json to docs/
        run: cp registry.json docs/registry.json

      - name: Commit updated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json docs/registry.json
          git diff --staged --quiet || git commit -m "auto: regenerate registry.json [skip ci]"
          git push